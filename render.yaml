# Render Blueprint for the PocketPilot API.
# Render dashboard → New → Blueprint → pick this repo. Then fill the "sync: false" values.
services:
  - type: web
    name: pocketpilot-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENVIRONMENT
        value: production
      - key: MONGODB_URI          # Atlas connection string (mongodb+srv://...)
        sync: false
      - key: DATABASE_NAME
        value: pocketpilot
      - key: JWT_SECRET
        generateValue: true       # Render generates a strong random secret
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: FRONTEND_URL         # e.g. https://pocketpilot.vercel.app (comma-separate several)
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: AI_PROVIDER          # groq | gemini | none
        value: groq
      - key: GROQ_API_KEY         # from console.groq.com; leave empty to use built-in answers
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_REASONING_EFFORT
        value: low
      - key: GEMINI_API_KEY       # only used when AI_PROVIDER=gemini
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_THINKING_LEVEL
        value: low
      - key: AI_RATE_LIMIT_PER_10_MIN
        value: "30"
      - key: ENABLE_NOTIFICATION_SIMULATOR
        value: "true"             # set to false once the Android app sends real data
